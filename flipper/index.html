<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Flipper plié">
  <meta name="theme-color" content="#05070f">
  <title>Flipper plié</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2305070f'/%3E%3Cpath d='M3 16h26' stroke='%2380ffb8' stroke-width='2'/%3E%3Ccircle cx='16' cy='9' r='4' fill='%23ff2985'/%3E%3Cpath d='M8 24l6 3M24 24l-6 3' stroke='%231accff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="../shared/ui.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="safe-probe"></div>

  <div id="hud" hidden>
    <div class="corner" id="hud-score"><small>SCORE</small><span id="score">0</span></div>
    <div class="corner" id="hud-right"><span id="hud-mult"></span><span id="hud-balls"></span></div>
    <button id="btn-pause" aria-label="Pause">II</button>
    <div id="toast"></div>
  </div>

  <section class="panel" id="panel-menu" hidden>
    <h1>FLIPPER <span>PLIÉ</span></h1>
    <p class="tag">La bille grimpe le pli</p>
    <button class="primary" id="btn-play">Jouer</button>
    <p class="big" id="best"></p>
    <p class="hint">Plie le téléphone comme un ordinateur portable. Touche à gauche ou à droite pour les batteurs.</p>
    <div class="row">
      <button class="link" id="btn-sound">Son activé</button>
      <a class="back" href="../">Tous les jeux</a>
    </div>
    <p class="diag" id="diag"></p>
  </section>

  <section class="panel" id="panel-gate" hidden>
    <div class="fold-picture" aria-hidden="true">
      <svg viewBox="0 0 96 96" fill="none" stroke="#80ffb8" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
        <path d="M22 60 L30 14 L74 14 L74 60"/>
        <path d="M10 82 L22 60 L74 60 L86 82 Z"/>
      </svg>
    </div>
    <h2 id="gate-title">Plie-moi</h2>
    <p class="big" id="gate-text"></p>
    <button class="link" id="btn-bypass">Jouer quand même</button>
  </section>

  <section class="panel" id="panel-pause" hidden>
    <h2>Pause</h2>
    <button class="primary" id="btn-resume">Reprendre</button>
    <button id="btn-quit">Menu</button>
  </section>

  <section class="panel" id="panel-over" hidden>
    <h2>Partie terminée</h2>
    <p class="code" id="over-score"></p>
    <p class="big" id="over-best"></p>
    <button class="primary" id="btn-again">Rejouer</button>
    <button id="btn-menu">Menu</button>
  </section>

  <script type="module" src="src/main.js"></script>
</body>
</html>
